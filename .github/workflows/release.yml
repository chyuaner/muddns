name: Build & Release

on:
  push:
    branches:
      - prod
    tags:
      - 'v*'

jobs:
  build-release:
    name: Cross-Compile & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download & Prepare Dependencies
        run: |
          go mod download
          go mod tidy

      - name: Cross-Compile Binaries
        run: |
          mkdir -p dist
          
          # Linux 平台
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/muddns-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/muddns-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/muddns-linux-armv7 .
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -ldflags="-s -w" -o dist/muddns-linux-386 .

          # Windows 平台
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/muddns-windows-amd64.exe .

          # macOS 平台
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/muddns-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/muddns-darwin-amd64 .

          # 計算校驗碼 (SHA256 Checksums)
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Generate Release Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "muddns Release ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/muddns-linux-amd64
            dist/muddns-linux-arm64
            dist/muddns-linux-armv7
            dist/muddns-linux-386
            dist/muddns-windows-amd64.exe
            dist/muddns-darwin-arm64
            dist/muddns-darwin-amd64
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
