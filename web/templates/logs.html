{{template "header" .}}
<div class="container">

    <!-- System Logs View -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">📜 系統日誌 (System Logs)</h2>
            <div>
                <a href="/logs" class="btn btn-secondary btn-sm">重新整理</a>
            </div>
        </div>
        
        <div class="log-list">
            {{range .Logs}}
            <div class="log-entry">
                <span class="log-time">[{{.Timestamp}}]</span>
                <span class="log-level-{{.Level}}">[{{.Level}}]</span>
                {{if .HostID}}<span style="color: var(--primary);">[{{.HostID}}]</span>{{end}}
                {{.Message}}
            </div>
            {{else}}
            <div style="color: var(--text-muted); text-align: center;">目前沒有日誌紀錄。</div>
            {{end}}
        </div>
    </div>

</div>
{{template "footer" .}}
